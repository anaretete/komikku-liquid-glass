name: Release Builder
# Build a stable release on a tag v* newly pushed or manual workflow_dispatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-build:
    runs-on: 'ubuntu-24.04'
    outputs:
      VERSION_TAG: ${{ steps.get_tag.outputs.VERSION_TAG }}
      CURRENT_SHA: ${{ steps.current_commit.outputs.CURRENT_SHA }}
      COMMIT_LOGS: ${{ steps.commit_logs.outputs.COMMIT_LOGS }}
    steps:
      - name: Get tag name (${{ github.ref }})
        id: get_tag
        run: |
          version_tag=$(echo ${GITHUB_REF/refs\/tags\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          if [ -z "$version_tag" ] || [ "$version_tag" = "liquid-glass-main" ]; then
            version_tag="v1.14.1-liquid-glass"
          fi
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT

      - name: Clone Repository (${{ steps.get_tag.outputs.VERSION_TAG }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Current commit
        id: current_commit
        run: |
          commit_count=$(git rev-list --count HEAD)
          current_sha=$(git rev-parse --short HEAD)
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          echo "CURRENT_SHA=$current_sha"
          echo "CURRENT_SHA=$current_sha" >> $GITHUB_OUTPUT

      - name: Commit logs
        id: commit_logs
        run: |
          echo "COMMIT_LOGS<<EOF" >> $GITHUB_OUTPUT
          git log -n 10 --oneline >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-app:
    name: Build release app
    runs-on: 'ubuntu-24.04'
    needs: prepare-build
    steps:
      - name: Clone Repository (${{ needs.prepare-build.outputs.VERSION_TAG }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_JSON }}
          write-mode: overwrite

      - name: Write client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        if: env.GOOGLE_CLIENT_SECRETS_JSON != ''
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck || true

      - name: Build app
        run: ./gradlew assembleRelease -Pdisable-code-shrink -Pinclude-telemetry -Penable-updater

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: "**/*.apk"
          retention-days: 1

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

  release-app:
    runs-on: 'ubuntu-24.04'
    needs:
      - prepare-build
      - build-app
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: '35.0.1'
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Get SHA & clean up build artifacts
        id: get_sha
        run: |
          set -e
          find app/build/outputs/apk/release -name "*.apk"
          if [ -f app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk ]; then
            mv app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk Komikku-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk Komikku-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk Komikku-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-x86-release-unsigned-signed.apk Komikku-x86-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-x86_64-release-unsigned-signed.apk Komikku-x86_64-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          else
            mv app/build/outputs/apk/release/app-universal-release.apk Komikku-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-arm64-v8a-release.apk Komikku-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk Komikku-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-x86-release.apk Komikku-x86-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            mv app/build/outputs/apk/release/app-x86_64-release.apk Komikku-x86_64-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare-build.outputs.VERSION_TAG }}
          name: Komikku Liquid Glass ${{ needs.prepare-build.outputs.VERSION_TAG }}
          body: |
            ## Komikku Liquid Glass (${{ needs.prepare-build.outputs.VERSION_TAG }})

            Full-scale **Liquid Glass UI Overhaul** featuring AGSL refractive shaders, chromatic aberration, spring physics, floating pill navigation chrome, and universal interactive glass surfaces across all buttons and screens.

            ### Available APK Downloads by Architecture:
            - **Universal (All devices):** `Komikku-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk`
            - **ARM64 (Modern Android phones):** `Komikku-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk`
            - **ARMv7 (Older 32-bit phones):** `Komikku-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk`
            - **x86_64 (64-bit Emulators / ChromeOS):** `Komikku-x86_64-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk`
            - **x86 (32-bit Emulators):** `Komikku-x86-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk`

            ### Commit Logs:
            ${{ needs.prepare-build.outputs.COMMIT_LOGS }}
          files: |
            Komikku-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Komikku-arm64-v8a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Komikku-armeabi-v7a-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Komikku-x86-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
            Komikku-x86_64-${{ needs.prepare-build.outputs.VERSION_TAG }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
