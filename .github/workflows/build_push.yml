name: CI
on:
  push:
    branches:
      # - develop
      - master
    paths:
      - '**'
      - '!**.md'
  # pull_request:
  #   paths-ignore:
  #     - '**.md'
  # Dispatch or Manual triggers
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/google-services.json
          contents: ${{ secrets.GOOGLE_SERVICES_JSON }}
          write-mode: overwrite

      - name: Write client_secrets.json
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        if: env.GOOGLE_CLIENT_SECRETS_JSON != ''
        uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
        with:
          path: app/src/main/assets/client_secrets.json
          contents: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
          write-mode: overwrite

      - name: Ensure configuration files exist
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/client_secrets.json ]; then
            echo "{}" > app/src/main/assets/client_secrets.json
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "komikku-liquid-glass",
              "storage_bucket": "komikku-liquid-glass.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "app.komikku.beta"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567891",
                  "android_client_info": {
                    "package_name": "app.komikku.preview"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567892",
                  "android_client_info": {
                    "package_name": "app.komikku"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_key"}],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567893",
                  "android_client_info": {
                    "package_name": "eu.kanade.tachiyomi"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck || true

      - name: Build app
        run: ./gradlew assemblePreview -Penable-updater

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testReleaseUnitTest || true

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration || true

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testReleaseUnitTest

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: '35.0.1'
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename apk
        id: current_commit
        run: |
          set -e
          version_tag=$(echo ${GITHUB_REF/refs\/heads\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          commit_count=$(git rev-list --count HEAD)
          echo "VERSION_TAG=$version_tag"
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count"
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT
          find app/build/outputs/apk/preview -name "*.apk"
          if [ -f app/build/outputs/apk/preview/app-universal-preview-signed.apk ]; then
            cp app/build/outputs/apk/preview/app-universal-preview-signed.apk Komikku-$version_tag-r$commit_count.apk
          elif [ -f app/build/outputs/apk/preview/app-arm64-v8a-preview.apk ]; then
            cp app/build/outputs/apk/preview/app-arm64-v8a-preview.apk Komikku-arm64-v8a-$version_tag-r$commit_count.apk
          fi
          find app/build/outputs/apk/preview -name "*.apk" -exec cp {} ./ \;

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-${{ steps.current_commit.outputs.VERSION_TAG }}-r${{ steps.current_commit.outputs.COMMIT_COUNT }}.apk
          path: ./*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/preview
