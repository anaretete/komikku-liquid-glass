name: CI
on:
  push:
    branches:
      - master
      - liquid-glass-main
    paths:
      - '**'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build app
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Ensure configuration files exist
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/client_secrets.json ]; then
            echo "{}" > app/src/main/assets/client_secrets.json
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "komikku-liquid-glass",
              "storage_bucket": "komikku-liquid-glass.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "eu.kanade.tachiyomi"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "dummy_key"}],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check code format
        run: ./gradlew spotlessCheck || true

      - name: Build app
        run: ./gradlew assemblePreview -Penable-updater --no-daemon

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          BUILD_TOOLS_VERSION: '35.0.1'
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/preview
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs
        id: current_commit
        run: |
          set -e
          version_tag=$(echo ${GITHUB_REF/refs\/heads\//} | sed -r 's/^refs\/(heads|tags)\///' | sed -r 's/[-\/]+/_/g')
          commit_count=$(git rev-list --count HEAD)
          echo "VERSION_TAG=$version_tag" >> $GITHUB_OUTPUT
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_OUTPUT

          mkdir -p apks_out
          find app/build/outputs/apk/preview/ -type f -name "*.apk" -exec cp {} apks_out/ \;
          ls -la apks_out/

      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Komikku-${{ steps.current_commit.outputs.VERSION_TAG }}-r${{ steps.current_commit.outputs.COMMIT_COUNT }}-apks
          path: apks_out/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: r${{ steps.current_commit.outputs.COMMIT_COUNT }}
          name: Komikku Preview r${{ steps.current_commit.outputs.COMMIT_COUNT }} (Liquid Glass)
          body: |
            Automated Preview Release for Komikku Liquid Glass.
            Commit: ${{ github.sha }}
            Tag: r${{ steps.current_commit.outputs.COMMIT_COUNT }}
          files: apks_out/*.apk
          draft: false
          prerelease: false
